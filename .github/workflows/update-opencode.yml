name: Update opencode

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve latest npm version
        id: latest
        run: |
          version="$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update pinned hashes
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          x64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/${VERSION}" | jq -r .dist.integrity)"
          arm64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-arm64/${VERSION}" | jq -r .dist.integrity)"

          # The CLI embeds an opencode-pty daemon. Read its version and checksum out
          # of the compiled binary so the pinned daemon always matches the protocol
          # the client speaks.
          tarball="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/${VERSION}" | jq -r .dist.tarball)"
          curl -fsSL "$tarball" | tar -xzO package/bin/opencode > "$RUNNER_TEMP/opencode"
          strings -n 8 "$RUNNER_TEMP/opencode" > "$RUNNER_TEMP/opencode.strings"

          line="$(grep -nF 'bunfs/root/opencode-pty-' "$RUNNER_TEMP/opencode.strings" | head -1 | cut -d: -f1)"
          if [ -z "$line" ]; then
            echo "Could not locate the embedded opencode-pty binary in opencode ${VERSION}" >&2
            exit 1
          fi
          pty_sha="$(sed -n "$((line + 1))p" "$RUNNER_TEMP/opencode.strings")"
          if ! printf '%s' "$pty_sha" | grep -qE '^[a-f0-9]{64}$'; then
            echo "Unexpected embedded opencode-pty checksum: ${pty_sha}" >&2
            exit 1
          fi

          offset="$(grep -aob "$pty_sha" "$RUNNER_TEMP/opencode" | head -1 | cut -d: -f1)"
          pty_version="$(dd if="$RUNNER_TEMP/opencode" bs=1 skip=$((offset - 300)) count=600 2>/dev/null \
            | strings -n 3 | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)"
          if [ -z "$pty_version" ]; then
            echo "Could not determine the embedded opencode-pty version" >&2
            exit 1
          fi

          pty_x64="$(curl -fsSL "https://registry.npmjs.org/@opencode-ai/pty-linux-x64-gnu/${pty_version}" | jq -r .dist.integrity)"
          pty_arm64="$(curl -fsSL "https://registry.npmjs.org/@opencode-ai/pty-linux-arm64-gnu/${pty_version}" | jq -r .dist.integrity)"

          downloaded_sha="$(curl -fsSL "https://registry.npmjs.org/@opencode-ai/pty-linux-x64-gnu/-/pty-linux-x64-gnu-${pty_version}.tgz" \
            | tar -xzO package/bin/opencode-pty | sha256sum | cut -d' ' -f1)"
          if [ "$downloaded_sha" != "$pty_sha" ]; then
            echo "opencode-pty ${pty_version} does not match the embedded daemon (${downloaded_sha} != ${pty_sha})" >&2
            exit 1
          fi

          jq -n \
            --arg v "$VERSION" --arg x "$x64" --arg a "$arm64" \
            --arg pv "$pty_version" --arg px "$pty_x64" --arg pa "$pty_arm64" \
            '{
              version: $v,
              packages: {"x86_64-linux": $x, "aarch64-linux": $a},
              pty: {version: $pv, packages: {"x86_64-linux": $px, "aarch64-linux": $pa}}
            }' > overlays/opencode/version.json

      - name: Build
        run: nix build --no-link .#packages.x86_64-linux.opencode

      - name: Commit
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/opencode/version.json flake.lock
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --cached --quiet; then
            if [ "$(date -u +%d)" = "01" ]; then
              git commit --allow-empty -m "chore: keepalive"
              git push
            fi
          else
            git commit -m "chore(opencode): bump to ${VERSION}"
            git push
          fi
