name: Update opencode

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "overlays/opencode/**"
      - ".github/workflows/update-opencode.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Resolve latest npm version
        id: latest
        run: |
          version="$(curl -fsSL https://registry.npmjs.org/@opencode/cli/latest | jq -r .version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Update pinned hashes
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          x64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/${VERSION}" | jq -r .dist.integrity)"
          arm64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-arm64/${VERSION}" | jq -r .dist.integrity)"
          jq -n --arg v "$VERSION" --arg x "$x64" --arg a "$arm64" \
            '{version: $v, packages: {"x86_64-linux": $x, "aarch64-linux": $a}}' \
            > overlays/opencode/version.json

      - name: Build
        run: nix build --no-link .#packages.x86_64-linux.opencode

      - name: Commit
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/opencode/version.json flake.lock
          if git diff --cached --quiet; then
            if [ "$(date -u +%d)" = "01" ]; then
              git commit --allow-empty -m "chore: keepalive"
              git push
            fi
          else
            git commit -m "chore(opencode): bump to ${VERSION}"
            git push
          fi
