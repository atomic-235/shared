name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31

      - name: actionlint
        run: nix run nixpkgs#actionlint -- .github/workflows/*.yml

      - name: shellcheck
        run: |
          mapfile -t files < <(find scripts -name '*.sh' -not -path '*/.git/*')
          nix run nixpkgs#shellcheck -- -S warning "${files[@]}"

      - name: ruff
        run: |
          nix run nixpkgs#ruff -- check scripts
          nix run nixpkgs#ruff -- format --check scripts

      - name: nixfmt
        run: |
          mapfile -t files < <(find . -name '*.nix' -not -path './.git/*')
          nix run nixpkgs#nixfmt -- --check "${files[@]}"

      - name: gitleaks
        run: nix run nixpkgs#gitleaks -- detect --no-git --source . --redact

      - name: zizmor
        run: nix run nixpkgs#zizmor -- --format plain .github/workflows
