name: Build waybar

on:
  push:
    paths:
      - "overlays/waybar/**"
      - "flake.lock"
      - ".github/workflows/build-waybar.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build --no-link .#packages.x86_64-linux.waybar
