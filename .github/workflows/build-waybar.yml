name: Build waybar

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "overlays/waybar/**"
      - "flake.lock"
      - ".github/workflows/build-waybar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v15
        with:
          name: atomic-235
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update nixpkgs
        if: github.event_name == 'schedule'
        run: nix flake update nixpkgs

      - name: Build if missing
        id: build
        run: |
          out=$(nix eval --raw .#packages.x86_64-linux.waybar.outPath)
          if nix path-info --store https://atomic-235.cachix.org "$out" >/dev/null 2>&1; then
            echo "waybar: already cached"
            echo "built=0" >> "$GITHUB_OUTPUT"
          else
            echo "waybar: building"
            nix build --no-link .#packages.x86_64-linux.waybar
            echo "built=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit lock
        if: github.event_name == 'schedule' && steps.build.outputs.built == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update nixpkgs"
          git push
